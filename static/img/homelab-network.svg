<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="696" viewBox="0 0 1200 696" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="casing" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="dilated"/>
      <feFlood flood-color="#ffffff" result="white"/>
      <feComposite in="white" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .halo { paint-order: stroke fill; stroke: #ffffff; stroke-linejoin: round; }
      .halo-label { stroke-width: 3.5px; }
    </style>
  </defs>

  <rect x="40" y="30" width="880" height="638" rx="16" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="54" y="54" font-size="12" font-weight="600" fill="#64748b" class="halo halo-label">8U half-width rack</text>

  <!-- Switch -->
  <g filter="url(#shadow)">
    <rect x="80" y="70" width="800" height="96" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="80" y="70" width="800" height="34" rx="10" fill="#1d4ed8"/>
    <rect x="80" y="90" width="800" height="14" fill="#1d4ed8"/>
    <text x="96" y="93" font-size="14" font-weight="700" fill="#ffffff">1U Managed Switch</text>
    <text x="96" y="125" font-size="12" fill="#1e3a8a">4&#215; 10GbE SFP+ &#183; 16&#215; 1GbE RJ45</text>
  </g>
  <g fill="#2563eb" opacity="0.85">
    <rect x="560" y="140" width="16" height="13" rx="2"/>
    <rect x="584" y="140" width="16" height="13" rx="2"/>
    <rect x="608" y="140" width="16" height="13" rx="2"/>
    <rect x="632" y="140" width="16" height="13" rx="2"/>
  </g>
  <g fill="#60a5fa" opacity="0.85">
    <rect x="96" y="141" width="8" height="11" rx="1"/>
    <rect x="110" y="141" width="8" height="11" rx="1"/>
    <rect x="124" y="141" width="8" height="11" rx="1"/>
    <rect x="138" y="141" width="8" height="11" rx="1"/>
    <rect x="152" y="141" width="8" height="11" rx="1"/>
    <rect x="166" y="141" width="8" height="11" rx="1"/>
    <rect x="180" y="141" width="8" height="11" rx="1"/>
    <rect x="194" y="141" width="8" height="11" rx="1"/>
    <rect x="208" y="141" width="8" height="11" rx="1"/>
    <rect x="222" y="141" width="8" height="11" rx="1"/>
    <rect x="236" y="141" width="8" height="11" rx="1"/>
    <rect x="250" y="141" width="8" height="11" rx="1"/>
    <rect x="264" y="141" width="8" height="11" rx="1"/>
    <rect x="278" y="141" width="8" height="11" rx="1"/>
    <rect x="292" y="141" width="8" height="11" rx="1"/>
    <rect x="306" y="141" width="8" height="11" rx="1"/>
  </g>

  <!-- Desktop -->
  <g filter="url(#shadow)">
    <rect x="940" y="70" width="220" height="96" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <rect x="940" y="70" width="220" height="34" rx="10" fill="#475569"/>
    <rect x="940" y="90" width="220" height="14" fill="#475569"/>
    <text x="956" y="93" font-size="14" font-weight="700" fill="#ffffff">Desktop</text>
    <text x="956" y="125" font-size="12" fill="#334155">10GbE SFP+ client</text>
  </g>
  <line x1="880" y1="118" x2="940" y2="118" stroke="#2563eb" stroke-width="3" filter="url(#casing)"/>
  <text x="910" y="108" font-size="10" font-weight="600" fill="#2563eb" text-anchor="middle" class="halo halo-label">10GbE</text>

  <!-- Node to switch links -->
  <g stroke-linecap="round" filter="url(#casing)">
    <line x1="185" y1="166" x2="185" y2="240" stroke="#2563eb" stroke-width="3"/>
    <line x1="215" y1="166" x2="215" y2="240" stroke="#0d9488" stroke-width="1.6"/>
    <line x1="465" y1="166" x2="465" y2="240" stroke="#2563eb" stroke-width="3"/>
    <line x1="495" y1="166" x2="495" y2="240" stroke="#0d9488" stroke-width="1.6"/>
    <line x1="745" y1="166" x2="745" y2="240" stroke="#2563eb" stroke-width="3"/>
    <line x1="775" y1="166" x2="775" y2="240" stroke="#0d9488" stroke-width="1.6"/>
  </g>
  <g fill="#2563eb">
    <circle cx="185" cy="210" r="4"/>
    <circle cx="465" cy="210" r="4"/>
    <circle cx="745" cy="210" r="4"/>
  </g>
  <g fill="#0d9488">
    <circle cx="215" cy="210" r="3"/>
    <circle cx="495" cy="210" r="3"/>
    <circle cx="775" cy="210" r="3"/>
  </g>

  <!-- Node 1 -->
  <g filter="url(#shadow)">
    <rect x="80" y="240" width="240" height="200" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <rect x="80" y="240" width="240" height="34" rx="12" fill="#047857"/>
    <rect x="80" y="260" width="240" height="14" fill="#047857"/>
    <text x="94" y="262" font-size="14" font-weight="700" fill="#ffffff">MS-01 &#183; node-1</text>
    <text x="96" y="306" font-size="12" fill="#334155">Intel Core i9-12900H</text>
    <text x="96" y="326" font-size="12" fill="#334155">64 GB RAM</text>
    <line x1="96" y1="340" x2="304" y2="340" stroke="#a7f3d0" stroke-width="1"/>
    <text x="96" y="360" font-size="11" fill="#475569">2&#215; 10GbE SFP+ &#183; 2&#215; 2.5GbE</text>
    <text x="96" y="382" font-size="11" fill="#475569">2&#215; USB4 &#183; PCIe HBA</text>
  </g>

  <!-- Node 2 -->
  <g filter="url(#shadow)">
    <rect x="360" y="240" width="240" height="200" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <rect x="360" y="240" width="240" height="34" rx="12" fill="#047857"/>
    <rect x="360" y="260" width="240" height="14" fill="#047857"/>
    <text x="374" y="262" font-size="14" font-weight="700" fill="#ffffff">MS-01 &#183; node-2</text>
    <text x="376" y="306" font-size="12" fill="#334155">Intel Core i9-12900H</text>
    <text x="376" y="326" font-size="12" fill="#334155">64 GB RAM</text>
    <line x1="376" y1="340" x2="584" y2="340" stroke="#a7f3d0" stroke-width="1"/>
    <text x="376" y="360" font-size="11" fill="#475569">2&#215; 10GbE SFP+ &#183; 2&#215; 2.5GbE</text>
    <text x="376" y="382" font-size="11" fill="#475569">2&#215; USB4 &#183; PCIe HBA</text>
  </g>

  <!-- Node 3 -->
  <g filter="url(#shadow)">
    <rect x="640" y="240" width="240" height="200" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <rect x="640" y="240" width="240" height="34" rx="12" fill="#047857"/>
    <rect x="640" y="260" width="240" height="14" fill="#047857"/>
    <text x="654" y="262" font-size="14" font-weight="700" fill="#ffffff">MS-01 &#183; node-3</text>
    <text x="656" y="306" font-size="12" fill="#334155">Intel Core i9-12900H</text>
    <text x="656" y="326" font-size="12" fill="#334155">64 GB RAM</text>
    <line x1="656" y1="340" x2="864" y2="340" stroke="#a7f3d0" stroke-width="1"/>
    <text x="656" y="360" font-size="11" fill="#475569">2&#215; 10GbE SFP+ &#183; 2&#215; 2.5GbE</text>
    <text x="656" y="382" font-size="11" fill="#475569">2&#215; USB4 &#183; PCIe HBA</text>
  </g>

  <!-- USB4 / Thunderbolt mesh between nodes -->
  <g stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" fill="none" filter="url(#casing)">
    <line x1="320" y1="310" x2="360" y2="310"/>
    <line x1="600" y1="310" x2="640" y2="310"/>
    <path d="M320 420 C 320 478, 640 478, 640 420"/>
  </g>
  <text x="340" y="300" font-size="9" font-weight="600" fill="#7c3aed" text-anchor="middle" class="halo halo-label">USB4</text>
  <text x="620" y="300" font-size="9" font-weight="600" fill="#7c3aed" text-anchor="middle" class="halo halo-label">USB4</text>
  <text x="400" y="468" font-size="9" font-weight="600" fill="#7c3aed" text-anchor="middle" class="halo halo-label">USB4</text>

  <!-- Node to JBOD storage links -->
  <g stroke="#d97706" stroke-width="2" stroke-dasharray="5 4" filter="url(#casing)">
    <line x1="200" y1="440" x2="200" y2="510"/>
    <line x1="480" y1="440" x2="480" y2="510"/>
    <line x1="760" y1="440" x2="760" y2="510"/>
  </g>
  <text x="208" y="478" font-size="10" font-weight="600" fill="#b45309" class="halo halo-label">SAS / HBA</text>

  <!-- JBOD -->
  <g filter="url(#shadow)">
    <rect x="80" y="510" width="800" height="120" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <rect x="80" y="510" width="800" height="34" rx="12" fill="#b45309"/>
    <rect x="80" y="530" width="800" height="14" fill="#b45309"/>
    <text x="96" y="533" font-size="14" font-weight="700" fill="#ffffff">6&#215; 3.5&quot; Hot-Swap HDD JBOD &#183; 2U</text>
  </g>
  <g font-size="10" font-weight="600" fill="#92400e" text-anchor="middle">
    <text x="200" y="558">node-1 &#183; 2 drives</text>
    <text x="480" y="558">node-2 &#183; 2 drives</text>
    <text x="760" y="558">node-3 &#183; 2 drives</text>
  </g>
  <g fill="#fffbeb" stroke="#d97706" stroke-width="1.5">
    <rect x="108" y="570" width="84" height="38" rx="4"/>
    <rect x="208" y="570" width="84" height="38" rx="4"/>
    <rect x="388" y="570" width="84" height="38" rx="4"/>
    <rect x="488" y="570" width="84" height="38" rx="4"/>
    <rect x="668" y="570" width="84" height="38" rx="4"/>
    <rect x="768" y="570" width="84" height="38" rx="4"/>
  </g>
  <g stroke="#d97706" stroke-width="2">
    <line x1="118" y1="578" x2="118" y2="600"/>
    <line x1="218" y1="578" x2="218" y2="600"/>
    <line x1="398" y1="578" x2="398" y2="600"/>
    <line x1="498" y1="578" x2="498" y2="600"/>
    <line x1="678" y1="578" x2="678" y2="600"/>
    <line x1="778" y1="578" x2="778" y2="600"/>
  </g>

  <!-- UPS -->
  <g filter="url(#shadow)">
    <rect x="940" y="186" width="220" height="54" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <rect x="940" y="186" width="220" height="26" rx="10" fill="#334155"/>
    <rect x="940" y="202" width="220" height="10" fill="#334155"/>
    <text x="956" y="204" font-size="12" font-weight="700" fill="#ffffff">External UPS</text>
    <text x="956" y="230" font-size="10" fill="#334155">Battery backup for the rack</text>
  </g>
  <line x1="920" y1="213" x2="940" y2="213" stroke="#64748b" stroke-width="1.8" stroke-dasharray="2 4" filter="url(#casing)"/>

  <!-- Legend -->
  <rect x="940" y="256" width="220" height="240" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="956" y="284" font-size="14" font-weight="700" fill="#0f172a">Legend</text>

  <line x1="956" y1="316" x2="998" y2="316" stroke="#2563eb" stroke-width="3"/>
  <text x="1008" y="320" font-size="11" fill="#334155">10GbE SFP+</text>
  <line x1="956" y1="350" x2="998" y2="350" stroke="#0d9488" stroke-width="1.6"/>
  <text x="1008" y="354" font-size="11" fill="#334155">2.5GbE RJ45</text>
  <line x1="956" y1="384" x2="998" y2="384" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="1008" y="388" font-size="11" fill="#334155">USB4 / Thunderbolt</text>
  <line x1="956" y1="418" x2="998" y2="418" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="1008" y="422" font-size="11" fill="#334155">SAS / HBA storage</text>
  <line x1="956" y1="452" x2="998" y2="452" stroke="#64748b" stroke-width="1.8" stroke-dasharray="2 4"/>
  <text x="1008" y="456" font-size="11" fill="#334155">Power</text>
</svg>
